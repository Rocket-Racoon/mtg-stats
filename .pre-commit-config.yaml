# Install once per clone:  pnpm hooks:install
# (= uv run --project apps/api pre-commit install). Never commit with --no-verify;
# CI re-runs the secrets check and fails the branch anyway (S-1.8.2).
minimum_pre_commit_version: '3.8'
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: end-of-file-fixer
        exclude: ^docs/backlog/

  - repo: local
    hooks:
      - id: secrets-check
        name: secrets check
        entry: uv run --project apps/api python scripts/secrets_check.py --staged
        language: system
        pass_filenames: false
        always_run: true
      # Ruff: the locked version from apps/api/uv.lock, one config for api and scripts.
      - id: ruff-check
        name: ruff check --fix
        entry: uv run --project apps/api ruff check --config apps/api/pyproject.toml --fix
        language: system
        types: [python]
        files: ^(apps/api|scripts)/
      - id: ruff-format
        name: ruff format
        entry: uv run --project apps/api ruff format --config apps/api/pyproject.toml
        language: system
        types: [python]
        files: ^(apps/api|scripts)/
      # Prettier and ESLint: the repo's own pinned versions, root configs.
      - id: prettier
        name: prettier --write
        entry: pnpm exec prettier --write --ignore-unknown --no-error-on-unmatched-pattern --ignore-path .prettierignore
        language: system
        files: \.(ts|tsx|js|mjs|cjs|json|ya?ml)$
        exclude: ^docs/backlog/
      - id: eslint
        name: eslint --fix
        entry: pnpm exec eslint --fix --no-warn-ignored
        language: system
        files: \.(ts|tsx|js|mjs|cjs)$
        exclude: ^docs/backlog/
