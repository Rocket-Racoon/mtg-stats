# Local dev stack. Run from the repo root:
#   docker compose -f infra/docker-compose.yml up -d postgres redis   # infrastructure only (native dev)
#   docker compose -f infra/docker-compose.yml up                     # the whole backend (S-1.3.2)
#
# The whole backend is postgres, redis, a one-shot `migrate`, then `api` and `worker`. api and
# worker start only after postgres and redis are healthy and `migrate` has completed successfully.
#   - migrate runs `alembic upgrade head` once, and only when APP_ENV=dev. Any other value makes it
#     exit 1 without touching the database, which also stops api and worker from starting, so the
#     API never serves an unmigrated schema. Override from the shell, for example
#     `APP_ENV=prod docker compose -f infra/docker-compose.yml up` (bash) to see the refusal.
#   - api runs `uvicorn --factory app.main:create_app --reload` on http://127.0.0.1:8000
#     (API_PORT changes the host port) with apps/api bind-mounted read-only, so saving a Python
#     file under apps/api/app reloads the API without rebuilding the image. Docker Desktop on
#     Windows and macOS does not deliver file-change events to the container, so the reloader
#     polls (WATCHFILES_FORCE_POLLING). Rebuild only when pyproject.toml or uv.lock change:
#     `docker compose -f infra/docker-compose.yml up --build`.
#   - worker runs the same image and mount with `python -m app.workers` and does NOT reload;
#     pick up a change with `docker compose -f infra/docker-compose.yml restart worker`.
#   - Inside Compose the services reach `postgres:5432` and `redis:6379`. REDIS_URL is set under
#     `environment:`. DATABASE_URL is built at container start by docker-entrypoint.sh from
#     POSTGRES_USER, POSTGRES_PASSWORD and POSTGRES_DB, which env_file passes from the root .env
#     (the same file the postgres container reads), so that file is the single source of the
#     credentials. The root .env keeps its 127.0.0.1 URLs for native dev.
#
# Changing a host port (bash):        POSTGRES_PORT=5433 docker compose -f infra/docker-compose.yml up -d postgres redis
# Changing a host port (PowerShell):  $env:POSTGRES_PORT=5433; docker compose -f infra/docker-compose.yml up -d postgres redis
# (REDIS_PORT works the same way.) The API's database URL (S-1.3.3) must use the same port.
#
# Compose reads interpolation values from infra/.env (the project directory), not the
# root .env, so no credential is interpolated: the postgres, migrate, api and worker services
# all take theirs from the root .env through env_file. Interpolation is used only for
# non-secret values that have defaults (the ports and APP_ENV).
#
# The fixed project name means all git worktrees share one set of containers and volumes,
# so `down -v` in any worktree wipes the shared dev database.
#
# env_file passes the whole root .env into the postgres container. That is acceptable for
# dev; S-1.3.3 may narrow it.
name: mtg-stats

services:
  postgres:
    # Debian (bookworm) for glibc text collation. CI (S-1.8.x) and prod (E-11) must use the same
    # Debian variant so ORDER BY on text sorts identically everywhere.
    image: postgres:16.10-bookworm
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: true
    environment:
      # Dev only: skip the fsync in initdb so a first start is fast on slow disks.
      POSTGRES_INITDB_ARGS: '--no-sync'
    # Dev only. synchronous_commit=off is crash-safe (a crash can lose the last commits but
    # never corrupts data). fsync=off and full_page_writes=off are deliberately NOT used:
    # they can silently corrupt the database after a Docker VM kill.
    command: ['postgres', '-c', 'synchronous_commit=off']
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h forces TCP: the entrypoint's temporary init server listens on the Unix socket
      # only, so a socket probe would pass before initialization finishes.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 5432 -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 60s
      start_interval: 1s

  redis:
    image: redis:7.4.6-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 60s
      start_interval: 1s

  # One-shot: applies migrations to the dev database, then exits. See the header.
  migrate:
    build:
      context: ../apps/api
      target: dev
    image: mtg-stats-api:dev
    entrypoint: ['/usr/local/bin/docker-entrypoint.sh']
    command: ['python', '-m', 'app.scripts.migrate_dev']
    restart: 'no'
    env_file:
      - path: ../.env
        required: true
    environment:
      APP_ENV: ${APP_ENV:-dev}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ../apps/api:/app:ro
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ../apps/api
      target: dev
    image: mtg-stats-api:dev
    entrypoint: ['/usr/local/bin/docker-entrypoint.sh']
    # --reload-dir limits the watch to the source; polling is for bind mounts on Docker Desktop.
    command:
      [
        'uvicorn',
        '--factory',
        'app.main:create_app',
        '--reload',
        '--reload-dir',
        '/app/app',
        '--host',
        '0.0.0.0',
        '--port',
        '8000',
      ]
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: true
    environment:
      APP_ENV: ${APP_ENV:-dev}
      REDIS_URL: redis://redis:6379/0
      WATCHFILES_FORCE_POLLING: 'true'
    ports:
      - '127.0.0.1:${API_PORT:-8000}:8000'
    volumes:
      - ../apps/api:/app:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # No curl in the slim image; a Python one-liner against the readiness probe.
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 1s

  worker:
    image: mtg-stats-api:dev
    build:
      context: ../apps/api
      target: dev
    entrypoint: ['/usr/local/bin/docker-entrypoint.sh']
    command: ['python', '-m', 'app.workers']
    restart: unless-stopped
    # init: a proper PID 1 so SIGTERM reaches the worker. The grace period must exceed
    # WORKER_SHUTDOWN_GRACE_SECONDS (default 30) plus the job_runs write budget
    # (RECORD_TIMEOUT_SECONDS, 3), or Docker SIGKILLs running jobs.
    init: true
    stop_grace_period: 45s
    env_file:
      - path: ../.env
        required: true
    environment:
      APP_ENV: ${APP_ENV:-dev}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ../apps/api:/app:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
