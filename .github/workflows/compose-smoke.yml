# Compose smoke test (S-1.3.2). Runs the real dev backend stack (infra/docker-compose.yml:
# postgres, redis, migrate, api, worker) and checks its acceptance criteria end to end with
# scripts/compose_smoke.sh: start order, the APP_ENV=dev migrate guard, /health/ready, hot reload
# within 5 s and the worker restart.
# It runs only when something it covers changes. It is not one of the required checks (`api` and
# `ts`, S-1.8.4); a red run still means don't merge until it's understood.
name: Compose smoke

on:
  pull_request:
    paths:
      - apps/api/**
      - infra/**
      - .env.example
      - scripts/compose_smoke.sh
      - .github/workflows/compose-smoke.yml
  push:
    branches: [main]
    paths:
      - apps/api/**
      - infra/**
      - .env.example
      - scripts/compose_smoke.sh
      - .github/workflows/compose-smoke.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compose-smoke:
    name: compose-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the stack and check it
        run: bash scripts/compose_smoke.sh

      - name: Container logs
        if: ${{ failure() }}
        run: |
          docker compose -f infra/docker-compose.yml ps -a
          docker compose -f infra/docker-compose.yml logs --no-color --timestamps

      - name: Tear down
        if: ${{ always() }}
        run: docker compose -f infra/docker-compose.yml down -v --remove-orphans
