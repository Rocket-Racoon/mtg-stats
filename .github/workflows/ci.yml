# CI (F-1.8). Runs on every pull request and every push to main.
# The checks themselves come from scripts/verify.js (S-1.8.1), so CI and `pnpm verify` run the
# same commands; this file adds only what is CI-specific (services, caches, the Alembic round-trip,
# the coverage summary and artifact).
# GitHub Free can't enforce branch protection on a private repo (decision I1): green CI before
# merge is a convention.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    name: api
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      # Same images as infra/docker-compose.yml.
      postgres:
        image: postgres:16.10-bookworm
        env:
          POSTGRES_USER: mtg_stats
          POSTGRES_PASSWORD: CHANGE_ME
          POSTGRES_DB: mtg_stats
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U mtg_stats -d mtg_stats"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4.6-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Throwaway CI database: the `mtg_stats` database is migrated by this job (alembic check and
      # the round-trip); the tests use `mtg_stats_test` (conftest forces APP_ENV=test and its URL).
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://mtg_stats:CHANGE_ME@127.0.0.1:5432/mtg_stats
      REDIS_URL: redis://127.0.0.1:6379/0
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Pinned so CI can't change behaviour without a commit; keep it in step with the uv
          # version used to write apps/api/uv.lock.
          version: 0.10.12
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Create the test database
        # Same SQL the local Compose stack runs on first start.
        run: >-
          docker exec -i ${{ job.services.postgres.id }}
          psql -v ON_ERROR_STOP=1 -U mtg_stats -d mtg_stats
          < ../../infra/postgres/init/01-create-test-db.sql

      - name: Migrate the CI database to head
        run: uv run alembic upgrade head

      - name: Verify (API half)
        # secrets check, ruff check, ruff format --check, mypy --strict, pytest with coverage,
        # alembic check. PYTEST_ADDOPTS only adds report formats; the 85% threshold is verify's.
        working-directory: .
        env:
          PYTEST_ADDOPTS: --cov-report=term --cov-report=xml:coverage.xml --cov-report=html:htmlcov
        run: node scripts/verify.js --only api

      - name: Alembic round-trip
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check

      - name: Coverage summary
        # always(): also after a failure or a job timeout, so the figure is on the run page.
        if: ${{ always() }}
        run: |
          if [ ! -f .coverage ]; then
            echo "### Coverage: not measured (pytest did not complete)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Shown to 2 decimals; the verdict uses coverage's default precision (0), which is
          # what `--cov-fail-under` compares, so the summary never disagrees with the gate.
          shown=$(uv run --frozen coverage report --format=total --precision=2) || shown=""
          gate=$(uv run --frozen coverage report --format=total) || gate=""
          if [ -z "$shown" ] || [ -z "$gate" ]; then
            echo "### Coverage: could not be read from the coverage data" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Keep the minimum in step with `--cov-fail-under` in scripts/verify.js.
          if awk -v t="$gate" 'BEGIN { exit !(t >= 85) }'; then verdict="passed"; else verdict="**below the minimum**"; fi
          {
            echo "### Coverage: ${shown}% (minimum 85%, ${verdict})"
            echo ""
            echo "The full report is the \`coverage-report\` artifact of this run (kept 7 days)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: |
            apps/api/coverage.xml
            apps/api/htmlcov/
          retention-days: 7
          if-no-files-found: ignore
