[project]
name = "mtg-stats-api"
version = "0.1.0"
description = "MTG Stats API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "psycopg[binary]>=3.3",
    "alembic>=1.20",
    "pydantic-settings>=2.16",
    "httpx>=0.27",
    "pyjwt>=2.9",
    "arq>=0.28",
    "redis>=5.3.1",
]

[dependency-groups]
dev = [
    "ruff>=0.17",
    "mypy>=2.4",
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "pytest-asyncio>=1.4",
    "factory-boy>=3.3",
    "pre-commit>=3.8",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF",
    "N", "C4", "PT", "PTH", "TID", "T20", "S", "DTZ", "RET", "PIE", "PL", "FAST",
]
ignore = ["PLR2004", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]
"migrations/versions/*" = ["F401"]  # templates import `sa`/`op` even when unused

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Security", "fastapi.Query", "fastapi.Path", "fastapi.Body",
    "fastapi.Header", "fastapi.Cookie", "fastapi.Form", "fastapi.File",
]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["sqlalchemy.orm.declared_attr"]

[tool.ruff.lint.pylint]
max-returns = 10
max-branches = 20

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests", "app"]
python_files = ["test_*.py"]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/*/tests/*"]

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
